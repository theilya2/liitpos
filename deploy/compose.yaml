# Liitpos on the existing VPS, beside Liitshop. No host ports.
# Run from the repo root:
#   docker compose --env-file deploy/.env -f deploy/compose.yaml up -d --build
name: liitpos

services:
  liitpos-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VITE_PUBLIC_ORIGIN: https://liitpos.185-250-36-27.sslip.io
    image: liitpos-app:local
    hostname: liitpos-app
    networks:
      liitpos_internal: {}
      proxy:
        aliases:
          - liitpos-app
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      BETTER_AUTH_URL: https://liitpos.185-250-36-27.sslip.io
      LIITPOS_DB_HOST: liitpos-db
      LIITPOS_DB_NAME: liitpos
    secrets:
      - admin_username
      - admin_password
      - admin_password_hash
      - db_user
      - db_password
    depends_on:
      liitpos-db:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  liitpos-db:
    image: postgres:16-alpine
    hostname: liitpos-db
    networks:
      - liitpos_internal
    environment:
      POSTGRES_DB: liitpos
      POSTGRES_USER_FILE: /run/secrets/db_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_user
      - db_password
    volumes:
      - liitpos_pg:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d liitpos -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  liitpos_internal:
    name: liitpos_internal
  proxy:
    external: true
    name: ${LIITPOS_PROXY_NETWORK:?Set LIITPOS_PROXY_NETWORK to the Docker network Caddy already uses}

volumes:
  liitpos_pg:
    name: liitpos_pg

secrets:
  admin_username:
    file: ./secrets/admin_username
  admin_password:
    file: ./secrets/admin_password
  admin_password_hash:
    file: ./secrets/admin_password_hash
  db_user:
    file: ./secrets/db_user
  db_password:
    file: ./secrets/db_password
